<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Centrifugación AR - Dashboard Industrial</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Roboto+Mono:wght@400;700&display=swap');

        body { margin: 0; overflow: hidden; background-color: #0f1115; }

        /* Contenedor principal de la interfaz superpuesta */
        #ui-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
            display: flex; flex-direction: column; justify-content: flex-end;
            z-index: 9999;
        }

        /* Panel de control estilo Industrial / Grafito */
        #dashboard {
            pointer-events: auto;
            background: rgba(24, 28, 36, 0.95);
            border-top: 2px solid #ffb300; /* Borde superior ámbar */
            padding: 20px;
            font-family: 'Rajdhani', sans-serif;
            color: #a0aab5;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        /* Encabezado */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2a313d; padding-bottom: 10px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .header h1 { font-size: 16px; color: #ffb300; margin: 0; font-weight: 700; }
        .header .badge {
            font-size: 11px; background: #202530; padding: 4px 10px;
            border-radius: 4px; border: 1px solid #363e4d; color: #d1d5db;
        }

        /* Sección de Sliders */
        .sliders-container { display: flex; flex-direction: column; gap: 10px; }
        .slider-row {
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
        }
        .slider-label { width: 90px; font-size: 13px; font-weight: 700; color: #cfd6df; }
        .slider-val { width: 70px; text-align: right; font-size: 14px; color: #ffb300; font-weight: 700; font-family: 'Roboto Mono', monospace; }
        
        /* Controles deslizantes (Estilo LED Ámbar) */
        input[type=range] {
            -webkit-appearance: none; appearance: none;
            flex-grow: 1; height: 10px; background: #202530;
            border-radius: 5px; outline: none; border: 1px solid #363e4d;
            background: linear-gradient(to right, #ffb300 var(--val, 0%), #202530 var(--val, 0%));
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; border-radius: 50%;
            background: #ffb300; border: 2px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 179, 0, 0.6); cursor: pointer;
        }

        /* Cuadrícula de Telemetría */
        .telemetry-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .tel-card {
            background: #1e232e; border: 1px solid #363e4d;
            border-radius: 6px; padding: 10px;
            display: flex; flex-direction: column; justify-content: center;
            border-left: 3px solid #ffb300; /* Detalle estructural */
        }
        .tel-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; color: #8895a5; }
        .tel-value { font-size: 16px; font-weight: 700; font-family: 'Roboto Mono', monospace; }
        
        /* Paleta de colores para los valores */
        .val-amber { color: #ffb300; }
        .val-white { color: #ffffff; }
        .val-red { color: #e53935; }
        .val-green { color: #43a047; }

        /* Pie de página */
        .footer-row {
            display: flex; justify-content: space-between; align-items: center; margin-top: 5px;
        }
        .formulas { font-size: 10px; font-family: 'Roboto Mono', monospace; color: #5b697a; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn {
            background: #202530; border-radius: 4px; padding: 8px 20px;
            font-size: 11px; font-family: 'Roboto Mono', monospace;
            text-transform: uppercase; cursor: pointer; font-weight: 700;
            transition: all 0.2s ease;
        }
        .btn-reset { color: #ffb300; border: 1px solid #ffb300; }
        .btn-reset:active { background: rgba(255, 179, 0, 0.15); }
        .btn-pausa { color: #e53935; border: 1px solid #e53935; }
        .btn-pausa:active { background: rgba(229, 57, 53, 0.15); }

        /* Ajustes responsivos */
        @media (max-width: 600px) {
            .telemetry-grid { grid-template-columns: repeat(2, 1fr); }
            .formulas { display: none; }
            #dashboard { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="ui-wrapper">
        <div id="dashboard">
            <div class="header">
                <h1>CENTRIFUGACION</h1>
                <span class="badge">Unidad III · MECANICA DE FLUIDOS-II</span>
            </div>

            <div class="sliders-container">
                <div class="slider-row">
                    <span class="slider-label">RPM (N)</span>
                    <input type="range" id="sliderRPM" min="0" max="1000" value="400">
                    <span class="slider-val" id="lblRPM">400</span>
                </div>
                <div class="slider-row">
                    <span class="slider-label">Radio r (m)</span>
                    <input type="range" id="sliderRad" min="0.1" max="1.0" step="0.05" value="0.30">
                    <span class="slider-val" id="lblRad">0.30</span>
                </div>
                <div class="slider-row">
                    <span class="slider-label">Δρ (kg/m³)</span>
                    <input type="range" id="sliderDen" min="100" max="2000" step="50" value="600">
                    <span class="slider-val" id="lblDen">600</span>
                </div>
                <div class="slider-row">
                    <span class="slider-label">d_p (μm)</span>
                    <input type="range" id="sliderDiam" min="5" max="100" step="1" value="50">
                    <span class="slider-val" id="lblDiam">50</span>
                </div>
                <div class="slider-row">
                    <span class="slider-label">Viscosidad μ (mPas)</span>
                    <input type="range" id="sliderVisc" min="0.1" max="10.0" step="0.1" value="1.0">
                    <span class="slider-val" id="lblVisc">1.0</span>
                </div>
            </div>

            <div class="telemetry-grid">
                <div class="tel-card">
                    <span class="tel-title">OMEGA RAD/S</span>
                    <span class="tel-value val-white" id="valOmega">41.9 rad/s</span>
                </div>
                <div class="tel-card">
                    <span class="tel-title">FACTOR G</span>
                    <span class="tel-value val-amber" id="valFactorG">53.7 G</span>
                </div>
                <div class="tel-card">
                    <span class="tel-title">FUERZA FC</span>
                    <span class="tel-value val-red" id="valFuerza">55.12 nN</span>
                </div>
                <div class="tel-card">
                    <span class="tel-title">V. MIGRAC.</span>
                    <span class="tel-value val-white" id="valVelMigracion">43.865 mm/s</span>
                </div>
                <div class="tel-card">
                    <span class="tel-title">AC M/S²</span>
                    <span class="tel-value val-amber" id="valAceleracion">526.4 m/s²</span>
                </div>
                <div class="tel-card">
                    <span class="tel-title">ZONA SEP.</span>
                    <span class="tel-value val-green" id="valZona">Baja</span>
                </div>
            </div>

            <div class="footer-row">
                <span class="formulas">G=w²r/g | Vm=d²Δpw²r/18μ | w=2πN/60</span>
                <div class="btn-group">
                    <button id="btnReiniciar" class="btn btn-reset">RESET</button>
                    <button id="btnPausa" class="btn btn-pausa">PAUSA</button>
                </div>
            </div>
        </div>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="alpha: true;">
        <a-marker preset="hiro">
            <a-entity id="tambor" position="0 0.5 0">
                <a-cylinder id="tamborBase" radius="0.3" height="0.02" position="0 -0.25 0" color="#202530"></a-cylinder>
                <a-box id="marcaBaseX" position="0 -0.24 0" width="0.6" height="0.03" depth="0.02" color="#ffb300"></a-box>
                <a-box id="marcaBaseZ" position="0 -0.24 0" width="0.02" height="0.03" depth="0.6" color="#ffb300"></a-box>
                <a-cylinder id="tamborPared" radius="0.3" height="0.5" material="color: #ffffff; opacity: 0.15; transparent: true; side: double" open-ended="true"></a-cylinder>
                <a-cylinder id="tamborJaula" radius="0.305" height="0.505" material="color: #ffb300; wireframe: true" open-ended="true" segments-radial="13"></a-cylinder>
                <a-entity id="contenedor-particulas"></a-entity>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const sliders = document.querySelectorAll('input[type=range]');
            
            const inputs = {
                rpm: document.getElementById("sliderRPM"),
                rad: document.getElementById("sliderRad"),
                den: document.getElementById("sliderDen"),
                diam: document.getElementById("sliderDiam"),
                visc: document.getElementById("sliderVisc")
            };

            const lbls = {
                rpm: document.getElementById("lblRPM"),
                rad: document.getElementById("lblRad"),
                den: document.getElementById("lblDen"),
                diam: document.getElementById("lblDiam"),
                visc: document.getElementById("lblVisc")
            };

            const displays = {
                omega: document.getElementById("valOmega"),
                factorG: document.getElementById("valFactorG"),
                fuerza: document.getElementById("valFuerza"),
                velMig: document.getElementById("valVelMigracion"),
                aceleracion: document.getElementById("valAceleracion"),
                zona: document.getElementById("valZona")
            };

            const btnPausa = document.getElementById("btnPausa");
            const btnReiniciar = document.getElementById("btnReiniciar");
            
            const tambor = document.getElementById("tambor");
            const contenedor = document.getElementById("contenedor-particulas");
            const geometriasTambor = {
                base: document.getElementById("tamborBase"),
                pared: document.getElementById("tamborPared"),
                jaula: document.getElementById("tamborJaula"),
                marcaX: document.getElementById("marcaBaseX"),
                marcaZ: document.getElementById("marcaBaseZ")
            };

            let estaPausado = false;
            let anguloTambor = 0;
            const gravedad = 9.81;
            const ESCALA_VEL_VISUAL = 20.0; 
            const cantidadParticulas = 80;
            const particulas = [];

            function generarParticulas() {
                contenedor.innerHTML = '';
                particulas.length = 0;
                let radioActual = parseFloat(inputs.rad.value);
                
                for (let i = 0; i < cantidadParticulas; i++) {
                    let el = document.createElement('a-sphere');
                    let esPesada = i < cantidadParticulas / 2;
                    let diamVisual = esPesada ? 0.015 : 0.008;

                    let p = {
                        el: el,
                        esPesada: esPesada,
                        r: Math.random() * (radioActual * 0.4),
                        theta: Math.random() * Math.PI * 2,
                        y: (Math.random() - 0.5) * 0.4,
                        radioEsfera: diamVisual
                    };

                    el.setAttribute('radius', diamVisual);
                    // Partículas rojas (pesadas) y plata metálico (ligeras)
                    el.setAttribute('color', esPesada ? '#e53935' : '#e0e0e0'); 
                    
                    let x = p.r * Math.cos(p.theta);
                    let z = p.r * Math.sin(p.theta);
                    el.setAttribute('position', `${x} ${p.y} ${z}`);
                    
                    contenedor.appendChild(el);
                    particulas.push(p);
                }
            }

            function actualizarEstiloSlider(slider) {
                const min = slider.min;
                const max = slider.max;
                const val = slider.value;
                const porcentaje = ((val - min) / (max - min)) * 100;
                slider.style.setProperty('--val', `${porcentaje}%`);
            }

            sliders.forEach(slider => {
                actualizarEstiloSlider(slider);
                slider.addEventListener('input', function() {
                    actualizarEstiloSlider(this);
                    calcularFisica();
                });
            });

            function calcularFisica() {
                let N = parseFloat(inputs.rpm.value);
                let r = parseFloat(inputs.rad.value);
                let deltaRho = parseFloat(inputs.den.value); 
                let dp_m = parseFloat(inputs.diam.value) * 1e-6; 
                let mu_Pas = parseFloat(inputs.visc.value) * 1e-3; 

                lbls.rpm.textContent = inputs.rpm.value;
                lbls.rad.textContent = parseFloat(inputs.rad.value).toFixed(2);
                lbls.den.textContent = inputs.den.value;
                lbls.diam.textContent = inputs.diam.value;
                lbls.visc.textContent = parseFloat(inputs.visc.value).toFixed(1);

                geometriasTambor.base.setAttribute('radius', r);
                geometriasTambor.pared.setAttribute('radius', r);
                geometriasTambor.jaula.setAttribute('radius', r + 0.005);
                geometriasTambor.marcaX.setAttribute('width', r * 2);
                geometriasTambor.marcaZ.setAttribute('depth', r * 2);

                let omega = (N * 2 * Math.PI) / 60; 
                let ac = (omega * omega) * r; 
                let factorG = ac / gravedad;
                
                let volumen = (Math.PI / 6) * Math.pow(dp_m, 3); 
                let fuerzaNeta_N = volumen * deltaRho * ac; 
                let fuerzaNeta_nN = fuerzaNeta_N * 1e9; 

                let v_m = (Math.pow(dp_m, 2) * deltaRho * ac) / (18 * mu_Pas);
                let v_m_mms = v_m * 1000; 

                let zona = factorG < 100 ? "Baja" : (factorG < 500 ? "Media" : "Alta");
                // Adaptación de los colores de alerta a la nueva paleta
                let colorZona = factorG < 100 ? "#43a047" : (factorG < 500 ? "#ffb300" : "#e53935"); 

                displays.omega.textContent = `${omega.toFixed(1)} rad/s`;
                displays.factorG.textContent = `${factorG.toFixed(1)} G`;
                displays.fuerza.textContent = `${fuerzaNeta_nN.toFixed(2)} nN`;
                displays.velMig.textContent = `${v_m_mms.toFixed(3)} mm/s`;
                displays.aceleracion.textContent = `${ac.toFixed(1)} m/s²`;
                
                displays.zona.textContent = zona;
                displays.zona.style.color = colorZona;

                return { N, r, v_m };
            }

            btnPausa.addEventListener("click", () => {
                estaPausado = !estaPausado;
                btnPausa.textContent = estaPausado ? "REANUDAR" : "PAUSA";
                btnPausa.style.borderColor = estaPausado ? "#43a047" : "#e53935";
                btnPausa.style.color = estaPausado ? "#43a047" : "#e53935";
            });

            btnReiniciar.addEventListener("click", () => {
                inputs.rpm.value = 0; actualizarEstiloSlider(inputs.rpm);
                if (estaPausado) btnPausa.click();
                generarParticulas();
                calcularFisica();
            });

            let ultimoTiempo = performance.now();
            generarParticulas();
            calcularFisica(); 

            function animar(tiempoActual) {
                const dt = (tiempoActual - ultimoTiempo) / 1000;
                ultimoTiempo = tiempoActual;

                if (!estaPausado) {
                    const fisicaActual = calcularFisica();
                    
                    anguloTambor += (fisicaActual.N * 6) * dt; 
                    tambor.setAttribute('rotation', `0 ${anguloTambor} 0`);

                    const limiteFisico = fisicaActual.r - 0.02;

                    particulas.forEach(p => {
                        if (p.r < limiteFisico) {
                            let multiplicadorMasa = p.esPesada ? 1.0 : 0.2; 
                            let avanceVisual = fisicaActual.v_m * multiplicadorMasa * ESCALA_VEL_VISUAL * dt;
                            p.r += avanceVisual;
                        }

                        p.r = Math.max(0.01, Math.min(p.r, limiteFisico));

                        let x = p.r * Math.cos(p.theta);
                        let z = p.r * Math.sin(p.theta);
                        p.el.setAttribute('position', `${x} ${p.y} ${z}`);
                    });
                }
                requestAnimationFrame(animar);
            }

            requestAnimationFrame(animar);
        });
    </script>
</body>
</html>
